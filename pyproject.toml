[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "swarmops"
version = "0.1.0"
description = "Agent-native swarm on cloud-native infrastructure: LangGraph swarm, async FastAPI and a Postgres checkpointer."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["langgraph", "multi-agent", "swarm", "fastapi", "cloud-native"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-swarm>=0.1,<0.2",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary,pool]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
swarmops = "swarmops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:langgraph.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
