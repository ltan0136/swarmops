name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        # Throwaway database that only exists for the length of this job.
        env:
          POSTGRES_USER: swarmops
          POSTGRES_PASSWORD: swarmops
          POSTGRES_DB: swarmops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swarmops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The scripted model means CI never calls a real LLM and needs no secrets.
      LLM_PROVIDER: fake
      SWARMOPS_TEST_DATABASE_URL: postgresql://swarmops:swarmops@localhost:5432/swarmops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -rs

  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Call the running API
        run: |
          curl -fsS http://localhost:8000/healthz | tee health.json
          grep -q AsyncPostgresSaver health.json
          curl -fsS -X POST http://localhost:8000/threads/ci/runs \
            -H 'Content-Type: application/json' \
            -d '{"message": "What is (12 + 3) * 4?"}' | tee run.json
          grep -q '"answer":"Final answer: 60' run.json
      - name: Restart the API and check the thread survived
        run: |
          docker compose restart api
          docker compose up -d --wait --wait-timeout 120
          curl -fsS http://localhost:8000/threads/ci | grep -q '"active_agent":"reviewer"'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
