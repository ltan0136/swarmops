name: swarmops

services:
  postgres:
    image: postgres:17-alpine
    # Default credentials are local-development placeholders; the port is bound to
    # localhost only. Override them in .env for anything beyond your own machine.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swarmops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swarmops}
      POSTGRES_DB: ${POSTGRES_DB:-swarmops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Always point the API at the bundled Postgres, whatever DATABASE_URL says in .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-swarmops}:${POSTGRES_PASSWORD:-swarmops}@postgres:5432/${POSTGRES_DB:-swarmops}
    ports:
      # Localhost only: v0.1 has no authentication, so do not expose it on your network.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # Lets the container reach an Ollama server running on your machine (Linux needs this).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # Optional local LLM. Start with: docker compose --profile local-llm up
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  pgdata:
  ollama:
